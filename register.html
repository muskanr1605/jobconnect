<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | JobConnect</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header class="navbar">
    <div class="container nav-container">

        <a href="index.html" class="logo">JobConnect</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="about.html">About Us</a>
            <a href="login.html">Login</a>
        </nav>

        <button class="menu-toggle" id="menuButton"
                aria-label="Toggle navigation"
                aria-expanded="false">
            ☰
        </button>

    </div>
</header>


<section class="form-section">

    <div class="form-container">

        <h2>Create Your Account</h2>

        <p>Join JobConnect and explore new opportunities.</p>

        <form id="registerForm">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email Address</label>

            <input
                type="email"
                id="registerEmail"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit phone number"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                name="password"
                placeholder="Create password (minimum 8 characters)"
                required
            >

            <label>Register As</label>

            <select id="role" name="role" required>

                <option value="">Select Account Type</option>

                <option value="SEEKER">Job Seeker</option>

                <option value="RECRUITER">Recruiter</option>

            </select>

            <button type="submit" class="btn full-btn">
                Create Account
            </button>

            <p id="registerMessage"></p>

        </form>

        <p>
            Already registered?
            <a href="login.html">Login Here</a>
        </p>

    </div>

</section>


<footer>
    <p>© 2026 JobConnect. All Rights Reserved.</p>
</footer>

</body>
</html>
