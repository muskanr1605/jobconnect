<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobConnect</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="navbar">
    <div class="container nav-container">

        <a href="index.html" class="logo">JobConnect</a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="about.html">About Us</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html" class="btn btn-primary">Register</a>
        </nav>

        <button class="menu-toggle" id="menuButton"
                aria-label="Toggle navigation"
                aria-expanded="false">
            ☰
        </button>

    </div>
</header>

<section class="form-section">
    <div class="form-container">
        <h2>Welcome Back!</h2>
        <p>Login to your JobConnect account.</p>

       <form id="loginForm">

    <label>Email Address</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
    >

    <button type="submit" class="btn full-btn">
        Login
    </button>

    <p id="loginMessage"></p>

</form>

        <p>Don't have an account? <a href="register.html">Register Now</a></p>
    </div>
</section>

<footer>
    <p>© 2026 JobConnect. All Rights Reserved.</p>
</footer>

</body>
</html>
